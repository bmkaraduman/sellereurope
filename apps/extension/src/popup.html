<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SellerEurope</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 0; padding: 12px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { padding: 6px 10px; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; cursor: pointer; }
  button.secondary { background: #e5e7eb; color: #111; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: block; margin-top: 6px; font-size: 12px; color: #444; }
  input { width: 100%; box-sizing: border-box; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .decision { font-weight: 700; padding: 4px 8px; border-radius: 4px; display: inline-block; margin: 6px 0; }
  .LIST { background: #dcfce7; color: #166534; } .SKIP { background: #fee2e2; color: #991b1b; } .MANUAL_REVIEW { background: #fef9c3; color: #854d0e; }
  table { width: 100%; border-collapse: collapse; } td { padding: 2px 0; } td:last-child { text-align: right; }
  ul { padding-left: 16px; margin: 4px 0; } details { margin-top: 10px; } .muted { color: #666; }
</style>
</head>
<body>
  <h1>SellerEurope</h1>
  <div id="product" class="muted">Open an Amazon EU product page…</div>
  <div class="row">
    <button id="analyze">Analyse for my store</button>
    <button id="list" class="secondary" disabled>List on target</button>
  </div>
  <div id="result"></div>
  <details>
    <summary>Settings</summary>
    <label>API URL <input id="apiUrl" /></label>
    <label>API token <input id="apiToken" type="password" /></label>
    <label>Store ID <input id="storeId" /></label>
    <div class="row"><button id="save" class="secondary">Save</button></div>
  </details>
  <script type="module" src="popup.js"></script>
</body>
</html>
